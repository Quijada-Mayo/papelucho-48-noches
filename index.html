<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cargando juego…</title><style>html,body{height:100%;margin:0;background:#0c1324;color:#fff;font-family:system-ui;display:grid;place-items:center}.box{text-align:center}.spin{width:54px;height:54px;border:5px solid #ffffff30;border-top-color:#f4c96a;border-radius:50%;animation:s 1s linear infinite;margin:auto}@keyframes s{to{transform:rotate(360deg)}}p{opacity:.8}</style></head><body><div class="box"><div class="spin"></div><h2>Preparando la aventura…</h2><p>Esto puede tardar unos segundos la primera vez.</p></div><script>(async()=>{try{let s='';for(let i=0;i<8;i++)s+=await(await fetch(`chunks/${String(i).padStart(2,'0')}.txt`)).text();const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div style="padding:24px"><h2>No se pudo cargar el juego</h2><p>Actualiza la página e inténtalo nuevamente.</p></div>';console.error(e)}})()</script></body></html>
